# No KSP/Unity Managed DLLs required: builds the dedicated server and shared projects.
# Full client (LmpClient) builds still use local/self-hosted runners with KSP managed DLLs.
# The inherited net5 test projects are kept for local/manual use, but hosted CI does not run them because
# windows-latest no longer includes the .NET 5 runtime required by testhost.

name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: server build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build server
        run: dotnet build Server/Server.csproj -c Release --nologo
