name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: package client server and master server
    runs-on:
      - self-hosted
      - windows
      - x64
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Bootstrap local build dependencies
        shell: pwsh
        env:
          VMP_KSP_ROOT: ${{ vars.VMP_KSP_ROOT }}
        run: .\Scripts\BootstrapLocalBuild.ps1 -KspRoot $env:VMP_KSP_ROOT

      - name: Package release zips
        shell: pwsh
        run: .\Scripts\PackageKspmpReleaseZips.ps1 -Configuration Release -IncludeMasterServer

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VladMultiplayer-Release
          path: |
            Build/Release/artifacts/VladMultiplayer-Client-Release.zip
            Build/Release/artifacts/VladMultiplayer-Server-Release.zip
            Build/Release/artifacts/VladMultiplayerMasterServer-Release.zip

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Build/Release/artifacts/VladMultiplayer-Client-Release.zip
            Build/Release/artifacts/VladMultiplayer-Server-Release.zip
            Build/Release/artifacts/VladMultiplayerMasterServer-Release.zip
          generate_release_notes: true
